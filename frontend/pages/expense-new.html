<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yeni Gider Kaydı | Akıllı Muhasebe</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
       
        textarea {
            resize: vertical; 
            min-height: 100px;
            max-width: 100%;
            width: 100%;
            box-sizing: border-box;
        }
    </style>
</head>
<body data-page="expense-new">
    <div id="sidebar-container"></div>
    <div class="main">
        <div id="header-container"></div>
        <main class="content">

            <div class="page-heading">
                <div>
                    <h1>Yeni Gider Kaydı</h1>
                    <p>Manuel gider kaydı oluşturun veya fiş/belge yükleyin.</p>
                </div>
                <div style="display:flex; gap:10px;">
                    <a class="btn btn-secondary" href="dashboard.html">Ana Sayfa</a>
                    <a class="btn btn-primary" href="expenses.html">Giderlere Dön</a>
                </div>
            </div>

            <form class="card form-card" data-demo-form data-redirect="expenses.html">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Tarih</label>
                        <input type="date" value="2026-08-06">
                    </div>
                    <div class="form-group">
                        <label>Tutar (₺)</label>
                        <input type="number" step="0.01" placeholder="0.00">
                    </div>
                    <div class="form-group">
                        <label>Kategori</label>
                        <select>
                            <option>Ofis</option>
                            <option>Ulaşım</option>
                            <option>Hizmet</option>
                            <option>Yemek / Temsil</option>
                            <option>Diğer</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Kaynak</label>
                        <select>
                            <option>Manuel</option>
                            <option>OCR</option>
                            <option>Banka Entegrasyonu</option>
                        </select>
                    </div>
                    <div class="form-group" style="grid-column: span 2;">
                        <label>Açıklama</label>
                        <textarea placeholder="Gider detay açıklaması"></textarea>
                    </div>
                </div>

                <br>
                <div class="form-group">
                    <label>Fiş / Belge</label>
                    <div style="border: 2px dashed #cbd5e1; border-radius: 8px; padding: 20px; text-align: center; background: #f8fafc;">
                        <p class="muted" style="margin-bottom: 10px;">Fiş veya belge görselini seçin</p>
                        <input type="file" accept="image/*,.pdf">
                    </div>
                </div>

                <div class="form-actions" style="margin-top:24px; display:flex; justify-content:flex-end; gap:10px;">
                    <a class="btn btn-secondary" href="expenses.html">İptal</a>
                    <button class="btn btn-primary" type="submit">Gideri Kaydet</button>
                </div>
            </form>

        </main>
    </div>
    <script src="../assets/js/script.js"></script>
</body>
</html>
