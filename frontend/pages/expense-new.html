<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yeni Gider Kaydı | Akıllı Muhasebe</title>
    <script src="../assets/js/dark-mode.js"></script>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="icon" href="../assets/img/logo-icon.png">
    <style>
       
        textarea {
            resize: vertical; 
            min-height: 100px;
            max-width: 100%;
            width: 100%;
            box-sizing: border-box;
        }

        @media (max-width: 768px) {
            textarea {
                max-width: 100%;
                width: 100%;
                box-sizing: border-box;
            }
        }

        @media (max-width: 480px) {
            textarea {
                min-height: 88px;
            }
        }
    </style>
</head>
<body data-page="expense-new">
    <div id="sidebar-container"></div>
    <div class="main">
        <div id="header-container"></div>
        <main class="content">

            <div class="page-heading">
                <div>
                    <h1>Yeni Gider Kaydı</h1>
                    <p>Manuel gider kaydı oluşturun veya fiş/belge yükleyin.</p>
                </div>
                <div style="display:flex; gap:10px;">
                    <a class="btn btn-secondary" href="dashboard.html">Ana Sayfa</a>
                    <a class="btn btn-primary" href="expenses.html">Giderlere Dön</a>
                </div>
            </div>

            <form class="card form-card" id="form-new-expense">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Firma</label>
                        <input type="text" id="gider-firma" placeholder="Tedarikçi / firma adı">
                    </div>
                    <div class="form-group">
                        <label>Tutar (₺)</label>
                        <input type="number" id="gider-tutar" step="0.01" placeholder="0.00">
                    </div>
                    <div class="form-group">
                        <label>KDV (₺)</label>
                        <input type="number" id="gider-kdv" step="0.01" placeholder="0.00">
                    </div>
                    <div class="form-group">
                        <label>Kategori</label>
                        <select id="gider-kategori">
                            <option>Ofis</option>
                            <option>Ulaşım</option>
                            <option>Hizmet</option>
                            <option>Yemek / Temsil</option>
                            <option>Diğer</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Kaynak</label>
                        <select id="gider-kaynak">
                            <option>Manuel</option>
                            <option>OCR</option>
                            <option>Banka Entegrasyonu</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Tarih</label>
                        <input type="date" id="gider-tarih" value="2026-08-06">
                    </div>
                    <div class="form-group" style="grid-column: span 2;">
                        <label>Açıklama</label>
                        <div class="input-mic">
                            <textarea id="gider_aciklama" placeholder="Konuşun, açıklama yazılsın..."></textarea>
                            <button type="button" class="mic-btn textarea-mic" title="Sesle yaz">🎤</button>
                        </div>
                    </div>
                </div>

                <br>
                <div class="form-group">
                    <label>Fiş / Belge</label>
                    <div class="dropzone" id="ocr-dropzone">
                        <p class="muted" style="margin-bottom: 8px;">Fişi buraya sürükleyin veya seçin</p>
                        <input type="file" id="ocr-file" accept="image/*,.pdf">
                        <p class="muted" id="ocr-status" style="margin-top:8px; display:none;">Tutar ve KDV taranıyor...</p>
                        <div class="ocr-progress" id="ocr-progress"><span></span></div>
                    </div>
                </div>

                <div class="form-actions" style="margin-top:24px; display:flex; justify-content:flex-end; gap:10px;">
                    <a class="btn btn-secondary" href="expenses.html">İptal</a>
                    <button class="btn btn-primary" type="submit">Gideri Kaydet</button>
                </div>
            </form>

        </main>
    </div>
    <script src="../assets/js/script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const tarihInput = document.getElementById('gider-tarih');
            const firmaInput = document.getElementById('gider-firma');
            const tutarInput = document.getElementById('gider-tutar');
            const kdvInput = document.getElementById('gider-kdv');
            const kaynakSelect = document.getElementById('gider-kaynak');
            const aciklamaInput = document.getElementById('gider_aciklama');
            const fileInput = document.getElementById('ocr-file');
            const ocrStatus = document.getElementById('ocr-status');
            const ocrProgress = document.getElementById('ocr-progress');
            const dropzone = document.getElementById('ocr-dropzone');
            let scannedFile = null;

            tarihInput.value = new Date().toISOString().slice(0, 10);

            function setProgress(on) {
                if (ocrStatus) ocrStatus.style.display = on ? 'block' : 'none';
                if (ocrProgress) ocrProgress.classList.toggle('is-active', !!on);
                dropzone?.classList.toggle('is-scanning', !!on);
            }

            function clearOcrFields() {
                firmaInput.value = '';
                tutarInput.value = '';
                kdvInput.value = '';
                aciklamaInput.value = '';
            }

            function applyOcr(data) {
                // Eski değerleri asla bırakma — yoksa ABC Ofis / 2450 gibi kalıntılar kalır
                clearOcrFields();
                firmaInput.value = data.firma || '';
                if (data.tarih) tarihInput.value = data.tarih;
                if (data.tutar != null && data.tutar !== '') tutarInput.value = data.tutar;
                if (data.kdv != null && data.kdv !== '') kdvInput.value = data.kdv;
                if (data.aciklama) aciklamaInput.value = data.aciklama;
                kaynakSelect.value = 'OCR';

                const missing = [];
                if (!firmaInput.value) missing.push('firma');
                if (!tutarInput.value) missing.push('tutar');
                if (missing.length) {
                    showToast('Kısmen okundu; eksik: ' + missing.join(', ') + '. Elle düzeltip kaydedin.', 'error');
                } else {
                    showToast('Fiş okundu — alanları kontrol edip kaydedin.');
                }
            }

            async function scanFile(file) {
                if (!file) return;
                if (!/^(image\/(jpeg|png|webp)|application\/pdf)$/i.test(file.type) && !/\.pdf$/i.test(file.name || '')) {
                    showToast('OCR için JPG, PNG, WEBP veya PDF yükleyin', 'error');
                    return;
                }
                scannedFile = file;
                clearOcrFields();
                setProgress(true);
                try {
                    const formData = new FormData();
                    formData.append('fis', file);
                    const data = await apiFetch('/api/expenses/scan', { method: 'POST', body: formData });
                    applyOcr(data);
                } catch (err) {
                    showToast(err.message || 'Fiş okunamadı', 'error');
                } finally {
                    setProgress(false);
                }
            }

            fileInput.addEventListener('change', () => {
                const file = fileInput.files[0];
                if (file) scanFile(file);
            });

            if (dropzone) {
                dropzone.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    dropzone.classList.add('dragover');
                });
                dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
                dropzone.addEventListener('drop', (e) => {
                    e.preventDefault();
                    dropzone.classList.remove('dragover');
                    const file = e.dataTransfer.files[0];
                    if (!file) return;
                    const dt = new DataTransfer();
                    dt.items.add(file);
                    fileInput.files = dt.files;
                    scannedFile = file;
                    scanFile(file);
                });
            }

            document.getElementById('form-new-expense').addEventListener('submit', async function (e) {
                e.preventDefault();
                const tarih = tarihInput.value;
                const tutar = tutarInput.value;
                const kategori = document.getElementById('gider-kategori').value;
                const kaynak = kaynakSelect.value;
                const aciklama = aciklamaInput.value.trim();
                const firma = firmaInput.value.trim();
                const file = scannedFile || fileInput.files[0];

                if (!tarih || tutar === '' || !kategori) {
                    showToast('Tarih, tutar ve kategori zorunludur', 'error');
                    return;
                }

                const formData = new FormData();
                formData.append('tarih', tarih);
                formData.append('tutar', tutar);
                formData.append('kategori', kategori);
                formData.append('kaynak', kaynak);
                if (aciklama) formData.append('aciklama', aciklama);
                if (firma) formData.append('firma', firma);
                if (file) formData.append('fis', file);

                const submitBtn = this.querySelector('button[type=submit]');
                if (submitBtn) submitBtn.disabled = true;
                try {
                    await apiFetch('/api/expenses', { method: 'POST', body: formData });
                    showToast('Gider kaydedildi');
                    setTimeout(() => { window.location.href = 'expenses.html'; }, 600);
                } catch (err) {
                    showToast(err.message || 'Gider kaydedilemedi', 'error');
                    if (submitBtn) submitBtn.disabled = false;
                }
            });
        });
    </script>
</body>
</html>
