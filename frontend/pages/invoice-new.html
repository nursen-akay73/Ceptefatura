<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yeni Fatura Oluştur | Akıllı Muhasebe</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="icon" href="../assets/img/logo-icon.png">
</head>
<body data-page="invoice-new">
    <div id="sidebar-container"></div>
    <div class="main">
        <div id="header-container"></div>
        <main class="content">

            <div class="page-heading">
                <div>
                    <h1>Yeni Fatura Oluştur</h1>
                    <p>Müşterinize manuel e-fatura veya e-arşiv faturası kesin.</p>
                </div>
                <div style="display:flex; gap:10px;">
                    <a class="btn btn-secondary" href="dashboard.html"> Ana Sayfa</a>
                    <a class="btn btn-primary" href="accounts.html"> Carilere Dön</a>
                    <a class="btn btn-primary" href="invoices.html"> Faturalara Dön</a>
                </div>
            </div>

            <form class="card form-card" data-demo-form data-redirect="invoices.html" data-toast="Fatura kaydedildi">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Fatura No</label>
                        <input type="text" value="INV-2026-004" readonly style="background:#f8fafc;">
                    </div>
                    <div class="form-group">
                        <label>Cari / Müşteri</label>
                        <select id="select-cari">
                            <option>ABC Teknoloji</option>
                            <option selected>XYZ Danışmanlık</option>
                            <option>Beta Lojistik</option>
                            <option>Gamma Yazılım & Donanım</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Fatura Türü</label>
                        <select>
                            <option>E-Fatura</option>
                            <option>E-Arşiv</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Kesim Tarihi</label>
                        <input type="date" value="2026-08-06">
                    </div>
                    <div class="form-group">
                        <label>Vade Tarihi</label>
                        <input type="date" value="2026-09-06">
                    </div>
                    <div class="form-group">
                        <label>Fatura Notu</label>
                        <div class="input-mic">
                            <input type="text" id="fatura_notu" placeholder="Konuşun, faturaya yazılsın...">
                            <button type="button" class="mic-btn" data-mic-for="fatura_notu" title="Sesle yaz">🎤</button>
                        </div>
                    </div>
                </div>

                <label class="repeat-toggle">
                    <span>Bu faturayı her ay otomatik tekrarla</span>
                    <span style="display:flex;align-items:center;gap:10px;">
                        <input type="checkbox" id="repeat-invoice">
                        <span class="switch"></span>
                    </span>
                </label>

                <br>
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                    <h3 style="font-size:15px; margin:0;">Fatura Kalemleri</h3>
                    <button type="button" class="btn btn-secondary" id="btn-add-row">＋ Kalem Ekle</button>
                </div>

                <div class="table-wrap">
                    <table class="table" id="items-table">
                        <thead>
                            <tr>
                                <th style="width:40%;">AÇIKLAMA</th>
                                <th>MİKTAR</th>
                                <th>BİRİM FİYAT (₺)</th>
                                <th>KDV %</th>
                                <th class="money">TUTAR</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="items-body">
                            <tr>
                                <td>
                                    <div class="input-mic">
                                        <input class="table-input item-desc" placeholder="Konuşun, faturaya yazılsın..." value="Danışmanlık Hizmet Bedeli">
                                        <button type="button" class="mic-btn" title="Sesle yaz">🎤</button>
                                    </div>
                                </td>
                                <td><input class="table-input item-qty" type="number" value="1" min="1"></td>
                                <td><input class="table-input item-price" type="number" value="8750"></td>
                                <td>
                                    <select class="table-input item-vat">
                                        <option value="20" selected>%20</option>
                                        <option value="10">%10</option>
                                        <option value="1">%1</option>
                                        <option value="0">%0</option>
                                    </select>
                                </td>
                                <td class="item-total money" style="font-weight:600;">₺8.750,00</td>
                                <td><button type="button" class="text-btn btn-delete-row" style="color:var(--danger);">Sil</button></td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="totals-card" id="invoice-totals">
                    <div><span>Ara toplam</span><span id="sum-sub">₺8.750,00</span></div>
                    <div><span>KDV</span><span id="sum-vat">₺1.750,00</span></div>
                    <div class="grand"><span>Genel toplam</span><span id="sum-grand">₺10.500,00</span></div>
                </div>

                <div class="form-actions" style="margin-top:24px; display:flex; justify-content:flex-end; gap:10px;">
                    <a class="btn btn-secondary" href="invoices.html">İptal</a>
                    <button class="btn btn-primary" type="submit">Faturayı Kaydet ve Gönder</button>
                </div>
            </form>

        </main>
    </div>

    <script src="../assets/js/script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
          
            const urlParams = new URLSearchParams(window.location.search);
            const selectedCariFromUrl = urlParams.get('cari');
            if (selectedCariFromUrl) {
                const selectCari = document.getElementById('select-cari');
                for (let i = 0; i < selectCari.options.length; i++) {
                    if (selectCari.options[i].text.toLowerCase() === selectedCariFromUrl.toLowerCase()) {
                        selectCari.selectedIndex = i;
                        break;
                    }
                }
            }

          
            const itemsBody = document.getElementById('items-body');
            const btnAddRow = document.getElementById('btn-add-row');

            function money(n) {
                return '₺' + n.toLocaleString('tr-TR', { minimumFractionDigits: 2 });
            }

            function calculateTotals() {
                let sub = 0, vat = 0;
                itemsBody.querySelectorAll('tr').forEach(row => {
                    const qty = parseFloat(row.querySelector('.item-qty').value) || 0;
                    const price = parseFloat(row.querySelector('.item-price').value) || 0;
                    const rate = parseFloat(row.querySelector('.item-vat')?.value) || 0;
                    const rowSub = qty * price;
                    const rowVat = rowSub * rate / 100;
                    sub += rowSub;
                    vat += rowVat;
                    row.querySelector('.item-total').innerText = money(rowSub + rowVat);
                });
                const subEl = document.getElementById('sum-sub');
                const vatEl = document.getElementById('sum-vat');
                const grandEl = document.getElementById('sum-grand');
                if (subEl) subEl.textContent = money(sub);
                if (vatEl) vatEl.textContent = money(vat);
                if (grandEl) grandEl.textContent = money(sub + vat);
            }
            calculateTotals();

            itemsBody.addEventListener('input', calculateTotals);
            itemsBody.addEventListener('change', calculateTotals);

            if (btnAddRow) {
                btnAddRow.addEventListener('click', function () {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
              <td>
                <div class="input-mic">
                  <input class="table-input item-desc" placeholder="Konuşun, faturaya yazılsın...">
                  <button type="button" class="mic-btn" title="Sesle yaz">🎤</button>
                </div>
              </td>
              <td><input class="table-input item-qty" type="number" value="1" min="1"></td>
              <td><input class="table-input item-price" type="number" value="0"></td>
              <td>
                <select class="table-input item-vat">
                  <option value="20" selected>%20</option>
                  <option value="10">%10</option>
                  <option value="1">%1</option>
                  <option value="0">%0</option>
                </select>
              </td>
              <td class="item-total money" style="font-weight:600;">₺0,00</td>
              <td><button type="button" class="text-btn btn-delete-row" style="color:var(--danger);">Sil</button></td>
            `;
                    itemsBody.appendChild(tr);
                    calculateTotals();
                });
            }

            document.getElementById("repeat-invoice")?.addEventListener("change", function () {
                if (this.checked) showToast("Bu fatura her ay otomatik tekrarlanacak");
            });

            itemsBody.addEventListener('click', function (e) {
                const micBtn = e.target.closest('.mic-btn');
                if (micBtn) {
                    const input = micBtn.closest('td')?.querySelector('.item-desc');
                    if (input) startSpeechToText(input, micBtn);
                    return;
                }
                if (e.target.classList.contains('btn-delete-row')) {
                    if (itemsBody.querySelectorAll('tr').length > 1) {
                        e.target.closest('tr').remove();
                        calculateTotals();
                    } else {
                        showToast("En az bir fatura kalemi bulunmalıdır.", "error");
                    }
                }
            });
        });
    </script>
</body>
</html>
