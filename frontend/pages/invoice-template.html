<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Otomatik Fatura Şablonu | Akıllı Muhasebe</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="icon" href="../assets/img/logo-icon.png">
</head>
<body data-page="invoice-template">
    <div id="sidebar-container"></div>
    <div class="main">
        <div id="header-container"></div>
        <main class="content">

            <div class="page-heading">
                <div>
                    <h1>Tekrarlayan Fatura Şablonu</h1>
                    <p>Aylık kira, aidat veya düzenli hizmetler için otomatik fatura kurgulayın.</p>
                </div>
                <div style="display:flex; gap:10px;">
                    <a class="btn btn-secondary" href="dashboard.html"> Ana Sayfa</a>
                    <a class="btn btn-primary" href="invoices.html"> Faturalara Dön</a>
                </div>
            </div>

            <div class="hint-banner">
                <span>Kira, aidat veya düzenli danışmanlık faturalarınız her ay belirlediğiniz günde otomatik oluşturulur.</span>
                <span class="badge info" id="next-run-badge">Sonraki: —</span>
            </div>

            <form class="card form-card" id="form-invoice-template">

                <div class="form-grid">
                    <div class="form-group"><label>Müşteri / Cari</label><select id="customer_id" name="customer_id"></select></div>
                    <div class="form-group"><label>Fatura Sıklığı</label><select id="fatura_sikligi" name="fatura_sikligi"><option>Aylık</option><option>Haftalık</option><option>3 Aylık</option><option>Yıllık</option></select></div>
                    <div class="form-group"><label>Başlangıç Tarihi</label><input type="date" id="baslangic_tarihi" name="baslangic_tarihi" value="2026-09-01"></div>
                    <div class="form-group"><label>Sonraki Fatura Tarihi</label><input type="date" id="sonraki_fatura_tarihi" name="sonraki_fatura_tarihi" value="2026-09-01"></div>
                    <div class="form-group full">
                        <label>Fatura Açıklaması</label>
                        <div class="input-mic">
                            <input id="aciklama" name="aciklama" placeholder="Konuşun, faturaya yazılsın...">
                            <button type="button" class="mic-btn" id="aciklama-mic-btn" title="Sesle yaz">🎤</button>
                        </div>
                    </div>
                    <div class="form-group"><label>Miktar</label><input type="number" id="miktar" name="miktar" value="1"></div>
                    <div class="form-group"><label>Birim Fiyat (₺)</label><input type="number" id="birim_fiyat" name="birim_fiyat" value="0"></div>
                    <div class="form-group"><label>KDV Oranı (%)</label><input type="number" id="kdv_orani" name="kdv_orani" value="20"></div>
                </div>

                <div class="form-actions">
                    <a class="btn btn-secondary" href="invoices.html">İptal</a>
                    <button class="btn btn-primary" type="submit">Otomatik Şablonu Kaydet</button>
                </div>
            </form>

        </main>
    </div>
    <script src="../assets/js/script.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", async function () {
            const start = document.getElementById("baslangic_tarihi");
            const next = document.getElementById("sonraki_fatura_tarihi");
            const badge = document.getElementById("next-run-badge");
            const syncBadge = () => {
                const value = next?.value || start?.value;
                badge.textContent = value ? "Sonraki: " + value : "Sonraki: —";
            };
            start?.addEventListener("input", syncBadge);
            next?.addEventListener("input", syncBadge);
            syncBadge();

            const customerSelect = document.getElementById("customer_id");
            try {
                const cariler = await apiFetch("/api/accounts");
                customerSelect.innerHTML = cariler
                    .map((c) => `<option value="${c.id}">${escapeHtml(c.cari_adi)}</option>`)
                    .join("");
                if (!cariler.length) {
                    showToast("Önce Cari Hesaplar sayfasından bir cari ekleyin", "error");
                }
            } catch (err) {
                showToast(err.message || "Cariler alınamadı", "error");
            }

            document.getElementById("form-invoice-template").addEventListener("submit", async function (e) {
                e.preventDefault();
                const account_id = customerSelect.value;
                if (!account_id) {
                    showToast("Önce bir cari seçin", "error");
                    return;
                }
                const submitBtn = this.querySelector("button[type=submit]");
                if (submitBtn) submitBtn.disabled = true;
                try {
                    await apiFetch("/api/invoices/templates", {
                        method: "POST",
                        body: {
                            account_id,
                            fatura_sikligi: document.getElementById("fatura_sikligi").value,
                            baslangic_tarihi: start.value,
                            sonraki_fatura_tarihi: next.value,
                            aciklama: document.getElementById("aciklama").value.trim(),
                            miktar: document.getElementById("miktar").value,
                            birim_fiyat: document.getElementById("birim_fiyat").value,
                            kdv_orani: document.getElementById("kdv_orani").value,
                        },
                    });
                    showToast("Otomatik şablon kaydedildi");
                    setTimeout(() => { window.location.href = "invoices.html"; }, 600);
                } catch (err) {
                    showToast(err.message || "Şablon kaydedilemedi", "error");
                    if (submitBtn) submitBtn.disabled = false;
                }
            });
        });
    </script>
</body>
</html>
