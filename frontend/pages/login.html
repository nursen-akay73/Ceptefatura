<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap | CepteFatura</title>
    <script src="../assets/js/dark-mode.js"></script>
    <link rel="stylesheet" href="../assets/css/style.css?v=splash3">
    <link rel="icon" href="../assets/img/logo-icon.png">
    <style>
      .app-splash { position:fixed; inset:0; z-index:100000; background:#fff; display:grid; place-items:center; overflow:hidden; }
      .app-splash.is-done { opacity:0; visibility:hidden; pointer-events:none; transition:opacity .5s ease, visibility .5s ease; }
      .splash-wave { position:absolute; left:-10%; right:-10%; bottom:12%; height:46%; background:radial-gradient(ellipse 60% 80% at 20% 40%, rgba(37,99,235,.12), transparent 70%), radial-gradient(ellipse 50% 70% at 80% 55%, rgba(14,165,233,.1), transparent 70%); border-radius:50%; animation:cfWave 2.8s ease-in-out infinite; }
      .splash-inner { position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; gap:36px; width:min(360px,86vw); }
      .splash-logo-wrap { position:relative; display:flex; align-items:center; gap:14px; min-height:80px; }
      .splash-logo-wrap::before { content:""; position:absolute; left:-8px; width:100px; height:100px; border-radius:50%; background:radial-gradient(circle, rgba(37,99,235,.42) 0%, rgba(37,99,235,0) 70%); animation:cfGlow 1.4s ease-in-out infinite; }
      .splash-icon { position:relative; height:70px; width:auto; animation:cfIcon 0.8s cubic-bezier(.16,1,.3,1) both; }
      .splash-word { position:relative; height:30px; width:auto; max-width:220px; animation:cfWord .6s cubic-bezier(.16,1,.3,1) .22s both; }
      .splash-skeleton { width:100%; display:flex; flex-direction:column; gap:12px; padding:22px 18px 16px; border:1px solid #e8eef5; border-radius:14px; background:#f8fafc; box-shadow:0 10px 28px rgba(15,23,42,.08); animation:cfCard .7s ease .3s both; }
      .sk-line { height:12px; border-radius:999px; background:linear-gradient(90deg,#e2e8f0 0%,#93c5fd 45%,#e2e8f0 80%); background-size:220% 100%; animation:cfShimmer 1.1s ease-in-out infinite; }
      .sk-line:nth-child(1){width:88%} .sk-line:nth-child(2){width:70%;animation-delay:.12s} .sk-line:nth-child(3){width:52%;animation-delay:.24s}
      .sk-check { width:24px; height:24px; margin-top:4px; align-self:flex-end; border-radius:50%; background:#2563eb; position:relative; box-shadow:0 6px 14px rgba(37,99,235,.4); animation:cfCheck .5s cubic-bezier(.16,1,.3,1) .75s both; }
      .sk-check::after { content:""; position:absolute; left:8px; top:5px; width:6px; height:11px; border:2.5px solid #fff; border-top:0; border-left:0; transform:rotate(45deg); }
      @keyframes cfGlow { 0%,100%{transform:scale(.88);opacity:.5} 50%{transform:scale(1.25);opacity:1} }
      @keyframes cfWave { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
      @keyframes cfIcon { 0%{opacity:0;transform:translateX(-40px) scale(.4)} 70%{opacity:1;transform:scale(1.1)} 100%{opacity:1;transform:scale(1)} }
      @keyframes cfWord { 0%{opacity:0;transform:translateX(-12px);filter:blur(6px)} 100%{opacity:1;transform:none;filter:none} }
      @keyframes cfCard { 0%{opacity:0;transform:translateY(18px) scale(.92)} 100%{opacity:1;transform:none} }
      @keyframes cfShimmer { 0%{background-position:100% 0} 100%{background-position:-100% 0} }
      @keyframes cfCheck { 0%{opacity:0;transform:scale(.3)} 100%{opacity:1;transform:scale(1)} }
    </style>
</head>
<body class="auth-page auth-split">
    <div id="app-splash" class="app-splash" aria-hidden="true">
        <div class="splash-wave" aria-hidden="true"></div>
        <div class="splash-inner">
            <div class="splash-logo-wrap">
                <img class="splash-icon" src="../assets/img/logo-icon.png" alt="">
                <img class="splash-word" src="../assets/img/logo-word.png" alt="CepteFatura">
            </div>
            <div class="splash-skeleton">
                <div class="sk-line"></div>
                <div class="sk-line"></div>
                <div class="sk-line"></div>
                <div class="sk-check"></div>
            </div>
        </div>
    </div>
    <div class="auth-shell">
        <aside class="auth-panel">
            <img src="../assets/img/logo-icon.png" alt="" width="48" height="48">
            <h2>2 dakikada e-fatura kesin, muhasebecinizle senkronize kalın</h2>
            <p>KOBİ ve esnaf için ferah ve anlaşılır muhasebe. Fatura, gider ve cari tek yerde; mali müşaviriniz de aynı panele bağlanır.</p>
        </aside>
        <div class="auth-box">
            <div class="auth-brand">
                <img class="brand-logo brand-logo-light" src="../assets/img/logo.png" alt="CepteFatura">
                <img class="brand-logo brand-logo-dark" src="../assets/img/logo-dark.png" alt="CepteFatura">
                <p>Hesabınıza giriş yapın</p>
            </div>
            <form data-auth-form="login">
                <div class="form-group"><label>E-posta</label><input type="email" id="email" name="email" placeholder="ornek@email.com" required></div>
                <div class="form-group">
                    <label>Şifre</label>
                    <div class="input-password">
                        <input type="password" id="sifre" name="sifre" placeholder="••••••••" required>
                        <button type="button" class="pw-toggle" data-password-toggle aria-label="Şifreyi göster" title="Şifreyi göster">
                            <svg class="pw-eye" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                            <svg class="pw-eye-off" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.7 5.1A10.4 10.4 0 0 1 12 5c6.5 0 10 7 10 7a18.5 18.5 0 0 1-2.2 3.1"/><path d="M6.6 6.6C3.9 8.5 2 12 2 12s3.5 7 10 7a9.8 9.8 0 0 0 4.4-1"/><path d="m2 2 20 20"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
                        </button>
                    </div>
                </div>
                <div class="auth-meta">
                    <label class="check-line">
                        <input type="checkbox" id="beni_hatirla" name="beni_hatirla">
                        <span>Beni hatırla</span>
                    </label>
                    <button type="button" class="text-btn" id="forgot-pass">Şifremi unuttum</button>
                </div>
                <button class="btn btn-primary" type="submit">Giriş Yap</button>
            </form>
            <div class="auth-footer">
                Hesabınız yok mu? <a href="register.html" data-open-app>Kayıt Ol</a>
                <span class="auth-footer-sep" aria-hidden="true">·</span>
                <a href="about.html">Hakkımızda</a>
            </div>
        </div>
    </div>
    <script src="../assets/js/script.js?v=splash3"></script>
</body>
</html>
