<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap | Akıllı Muhasebe</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="auth-page">
    <div class="auth-box">
        <div class="auth-brand">
            <h1>Akıllı Muhasebe</h1>
            <p>Finansal yönetiminizi kolaylaştırın</p>
        </div>
        <form data-demo-form data-redirect="dashboard.html">
            <div class="form-group"><label>E-posta</label><input type="email" id="email" name="email" placeholder="ornek@email.com" required></div>
            <div class="form-group"><label>Şifre</label><input type="password" id="sifre" name="sifre" placeholder="••••••••" required></div>
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;font-size:12px">
                <label><input type="checkbox" id="beni_hatirla" name="beni_hatirla"> Beni hatırla</label>
                <a href="#" style="color:var(--primary)">Şifremi unuttum</a>
            </div>
            <button class="btn btn-primary" type="submit">Giriş Yap</button>
        </form>
        <div class="auth-footer">Hesabınız yok mu? <a href="register.html">Ücretsiz Kayıt Ol</a></div>
    </div>
    <script src="../assets/js/script.js"></script>
</body>
</html>
